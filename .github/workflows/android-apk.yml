name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: storyforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk StoryForge-v1.2.0-debug.apk
          if gh release view v1.2.0-debug >/dev/null 2>&1; then
            gh release upload v1.2.0-debug StoryForge-v1.2.0-debug.apk --clobber
          else
            gh release create v1.2.0-debug StoryForge-v1.2.0-debug.apk --title "StoryForge 1.2.0 – Test-APK" --notes "Debug-Testversion: Playlist mit mehreren Liedern, automatische Foto-Ausrichtung. Für Updates auf bestehende APKs dauerhaftes Zertifikat erforderlich."
          fi

      - name: Record APK build result
        if: always()
        env:
          RUN_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          git pull --rebase origin main
          printf 'StoryForge APK Build: %s\nRun: https://github.com/dmpcwien/StoryForge-Android/actions/runs/%s\n' "$RUN_RESULT" "$RUN_ID" > BUILD-STATUS.md
          git add BUILD-STATUS.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record APK build result [skip ci]' || true
          git push origin HEAD:main
