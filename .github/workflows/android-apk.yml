name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: storyforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure persistent signing (optional)
        shell: bash
        env:
          SF_KEYSTORE_B64: ${{ secrets.SF_KEYSTORE_B64 }}
          SF_KEY_ALIAS: ${{ secrets.SF_KEY_ALIAS }}
          SF_STORE_PASSWORD: ${{ secrets.SF_STORE_PASSWORD }}
          SF_KEY_PASSWORD: ${{ secrets.SF_KEY_PASSWORD }}
        run: |
          if [[ -n "$SF_KEYSTORE_B64" && -n "$SF_KEY_ALIAS" && -n "$SF_STORE_PASSWORD" && -n "$SF_KEY_PASSWORD" ]]; then
            printf "%s" "$SF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/storyforge-signing.jks"
            chmod 600 "$RUNNER_TEMP/storyforge-signing.jks"
            echo "SF_KEYSTORE_FILE=$RUNNER_TEMP/storyforge-signing.jks" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=stable" >> "$GITHUB_ENV"
            echo "Signiere 1.3 mit festem Zertifikat."
          else
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "::warning::Kein permanentes Signing konfiguriert. Debug-APK ist nicht garantiert updatefaehig."
          fi
      - name: Test clip ordering and project editing
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build Android APK
        shell: bash
        run: |
          if [[ "$SIGNING_MODE" == "stable" ]]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk StoryForge-v1.3.5.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk StoryForge-v1.3.5.apk
          fi
          test -s StoryForge-v1.3.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose StoryForge-v1.3.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging StoryForge-v1.3.5.apk | head -n 3
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-1.3-APK
          path: StoryForge-v1.3.5.apk
          if-no-files-found: error
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$SIGNING_MODE" == "stable" ]]; then
            TAG=v1.3.5-signed
            NOTES="StoryForge 1.3.5 mit einem dauerhaft konfigurierten Zertifikat signiert. Updates funktionieren nur bei gleicher Signatur wie die installierte App."
          else
            TAG=v1.3.5-debug
            NOTES="StoryForge 1.3.5 Test-APK mit temporaerer GitHub Debug-Signatur. Bestehende Installation vorerst nicht loeschen; lokale Projekt-Backups sichern!"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" StoryForge-v1.3.5.apk --clobber
          else
            gh release create "$TAG" StoryForge-v1.3.5.apk --title "StoryForge 1.3.5 ($SIGNING_MODE)" --notes "$NOTES"
          fi
      - name: Record APK build result
        if: always()
        env:
          RUN_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          git pull --rebase origin main
          printf 'StoryForge APK Build: %s\nRun: https://github.com/dmpcwien/StoryForge-Android/actions/runs/%s\n' "$RUN_RESULT" "$RUN_ID" > BUILD-STATUS.md
          git add BUILD-STATUS.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record APK build result [skip ci]' || true
          git push origin HEAD:main
