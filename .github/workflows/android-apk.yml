name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Import StoryForge sources
        shell: bash
        run: |
          if [ -f source.tar.xz.b64 ]; then
            base64 --decode source.tar.xz.b64 | tar --exclude='.github/*' -xJf -
            git add app build.gradle settings.gradle gradle.properties
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import native StoryForge Android project [skip ci]'
              git push origin HEAD:main
            fi
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
