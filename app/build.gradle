plugins { id 'com.android.application' }

def storyforgeKeystore = System.getenv('SF_KEYSTORE_FILE')

android {
    namespace 'at.storyforge.editor'
    compileSdk 35

    defaultConfig {
        applicationId 'at.storyforge.editor'
        minSdk 29
        targetSdk 35
        versionCode 19
        versionName '1.3.6'
    }
    signingConfigs {
        if (storyforgeKeystore) {
            stableRelease {
                storeFile file(storyforgeKeystore)
                storePassword System.getenv('SF_STORE_PASSWORD')
                keyAlias System.getenv('SF_KEY_ALIAS')
                keyPassword System.getenv('SF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (storyforgeKeystore) signingConfig signingConfigs.stableRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // LGPL-3.0 default libraries plus GPL-3.0 codec additions (libx264).
    // Distribution of the complete app must comply with GPL-3.0 obligations.
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9'
}
