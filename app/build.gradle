plugins { id 'com.android.application' }

android {
    namespace 'at.storyforge.editor'
    compileSdk 35

    defaultConfig {
        applicationId 'at.storyforge.editor'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '1.2.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    // LGPL-3.0 default libraries plus GPL-3.0 codec additions (libx264).
    // Distribution of the complete app must comply with GPL-3.0 obligations.
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9'
}
